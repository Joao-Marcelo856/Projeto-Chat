<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Chat Clone - Pro</title>
    <style>
        :root {
            --bg-dark: #202225;
            --bg-main: #36393f;
            --bg-input: #40444b;
            --text-main: #dcddde;
            --blurple: #5865f2;
            --danger: #ed4245;
            --text-muted: #b9bbbe;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* BARRA LATERAL ESQUERDA (CANAIS) */
        .sidebar {
            width: 240px;
            background: #2f3136;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 15px;
            font-weight: bold;
            border-bottom: 1px solid #202225;
        }

        .channel-btn {
            padding: 10px;
            margin: 2px 8px;
            cursor: pointer;
            border-radius: 4px;
        }

        .channel-btn:hover,
        .active-room {
            background: #393d43;
            color: #fff;
        }

        /* ÁREA PRINCIPAL DO CHAT */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            position: relative;
        }

        .msg-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #eee;
            object-fit: cover;
        }

        .msg-content {
            display: flex;
            flex-direction: column;
        }

        .msg-author {
            font-weight: bold;
            color: #fff;
            font-size: 0.9em;
        }

        /* BARRA LATERAL DIREITA (USUÁRIOS) */
        .users-sidebar {
            width: 200px;
            background: #2f3136;
            padding: 10px;
            border-left: 1px solid #202225;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            cursor: pointer;
            border-radius: 5px;
        }

        .user-item:hover {
            background: #393d43;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #43b581;
            border-radius: 50%;
        }

        /* INPUT E CONTROLES */
        .input-container {
            padding: 20px;
            background: var(--bg-main);
        }

        #input {
            width: 100%;
            background: var(--bg-input);
            border: none;
            padding: 12px;
            border-radius: 8px;
            color: #fff;
            outline: none;
        }

        /* MODAL E CONFIGURAÇÕES */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-box {
            background: var(--bg-main);
            padding: 32px;
            border-radius: 8px;
            width: 400px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .modal-box h2 {
            margin-bottom: 8px;
            color: #fff;
        }

        .modal-box p {
            color: var(--text-muted);
            font-size: 0.9em;
            margin-bottom: 20px;
        }

        .auth-input {
            width: 100%;
            background: var(--bg-dark);
            border: 1px solid #202225;
            padding: 12px;
            border-radius: 4px;
            color: #fff;
            margin-bottom: 15px;
            outline: none;
        }

        .auth-input:focus {
            border-color: var(--blurple);
        }

        .avatar-preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 10px auto;
            display: block;
            border: 3px solid var(--blurple);
            object-fit: cover;
        }

        .settings-footer {
            background: #292b2f;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .gear-icon {
            cursor: pointer;
            font-size: 20px;
            transition: transform 0.3s;
            opacity: 0.7;
        }

        .gear-icon:hover {
            transform: rotate(90deg);
            opacity: 1;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-primary {
            background: var(--blurple);
            color: #fff;
        }

        .btn-primary:hover {
            background: #4752c4;
        }

        .toggle-link {
            color: #00aff4;
            cursor: pointer;
            font-size: 0.85em;
            margin-top: 15px;
            display: inline-block;
        }

        .toggle-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div id="auth-overlay" class="modal" style="display: flex;">
        <div class="modal-box">
            <h2 id="auth-title">Bem-vindo de volta!</h2>
            <p id="auth-subtitle">Estamos muito animados em te ver novamente!</p>

            <input type="text" id="auth-user" class="auth-input" placeholder="NOME DE USUÁRIO">
            <input type="password" id="auth-pass" class="auth-input" placeholder="SENHA">

            <button id="auth-submit-btn" class="btn btn-primary" onclick="handleAuth()">Entrar</button>

            <div id="auth-toggle-text" class="toggle-link" onclick="toggleAuthMode()">
                Precisando de uma conta? Registre-se
            </div>
        </div>
    </div>

    <div id="settings-modal" class="modal">
        <div class="modal-box">
            <h3>Configurações de Perfil</h3>
            <img id="preview-img" class="avatar-preview" src="/uploads/default-avatar.png">
            <input type="file" id="file-avatar" accept="image/*" onchange="previewFile()"
                style="margin: 10px 0; color: #fff; font-size: 0.8em;">
            <input type="text" id="new-name" class="auth-input" placeholder="Mudar nome de usuário">
            <button class="btn btn-primary" onclick="saveProfile()">Salvar</button>
            <button class="btn" onclick="toggleModal('settings-modal', false)"
                style="background:none; color: #fff; margin-top: 5px;">Cancelar</button>
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">Canais</div>
        <div class="channel-btn active-room" onclick="changeRoom(event, 'geral')"># geral</div>
        <div class="channel-btn" onclick="changeRoom(event, 'ajuda')"># ajuda</div>

        <div style="margin-top: auto;" class="settings-footer">
            <div id="user-info" style="display:flex; align-items:center; gap:8px;">
                <img id="my-avatar" src="/uploads/default-avatar.png"
                    style="width:32px; height:32px; border-radius:50%; object-fit: cover;">
                <span id="my-name"
                    style="font-size: 0.9em; font-weight: bold; max-width: 100px; overflow: hidden; text-overflow: ellipsis;">Usuário</span>
            </div>
            <span class="gear-icon" onclick="toggleModal('settings-modal', true)">⚙️</span>
        </div>
    </div>

    <div class="chat-area">
        <div id="messages"></div>
        <div class="input-container">
            <input type="text" id="input" placeholder="Conversar...">
        </div>
    </div>

    <div class="users-sidebar">
        <div
            style="font-weight:bold; margin-bottom:10px; font-size:0.75em; color:#8e9297; text-transform: uppercase; letter-spacing: 0.5px;">
            Usuários — <span id="user-count">0</span>
        </div>
        <div id="user-list"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUser = null;
        let currentAvatar = '/uploads/default-avatar.png';
        let currentRoom = 'geral';
        let isLoginMode = true;

        // --- AUTH LOGIC ---
        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            const title = document.getElementById('auth-title');
            const subtitle = document.getElementById('auth-subtitle');
            const btn = document.getElementById('auth-submit-btn');
            const toggleText = document.getElementById('auth-toggle-text');

            if (isLoginMode) {
                title.innerText = "Bem-vindo de volta!";
                subtitle.innerText = "Estamos muito animados em te ver novamente!";
                btn.innerText = "Entrar";
                toggleText.innerText = "Precisando de uma conta? Registre-se";
            } else {
                title.innerText = "Criar uma conta";
                subtitle.innerText = "Junte-se à nossa comunidade hoje mesmo!";
                btn.innerText = "Registrar";
                toggleText.innerText = "Já tem uma conta? Clique aqui";
            }
        }

        function handleAuth() {
            const username = document.getElementById('auth-user').value;
            const password = document.getElementById('auth-pass').value;

            if (!username || !password) return alert("Preencha todos os campos!");

            const eventType = isLoginMode ? 'login' : 'register';
            socket.emit(eventType, { username, password });
        }

        socket.on('auth_success', (data) => {
            currentUser = data.username;
            currentAvatar = data.avatar || '/uploads/default-avatar.png';
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('my-name').innerText = currentUser;
            document.getElementById('my-avatar').src = currentAvatar;
            socket.emit('switch_room', 'geral');
            socket.emit('get_users');
        });

        socket.on('auth_error', (msg) => alert(msg));

        // --- CHAT LOGIC ---
        function changeRoom(e, room) {
            currentRoom = room;
            document.getElementById('messages').innerHTML = '';
            socket.emit('switch_room', room);
            document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active-room'));
            if (e) e.target.classList.add('active-room');
        }

        function openDM(targetUser) {
            const room = [currentUser, targetUser].sort().join('_pm_');
            changeRoom(null, room);
        }

        document.getElementById('input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.target.value.trim()) {
                socket.emit('chat message', {
                    room: currentRoom,
                    user: currentUser,
                    avatar: currentAvatar,
                    text: e.target.value
                });
                e.target.value = '';
            }
        });

        socket.on('chat message', (data) => {
            if (data.room !== currentRoom) return;
            addMessageToUI(data);
        });

        socket.on('load_history', (rows) => {
            rows.forEach(row => addMessageToUI(row));
        });

        function addMessageToUI(data) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `
                <img src="${data.avatar || '/uploads/default-avatar.png'}" class="msg-avatar">
                <div class="msg-content">
                    <span class="msg-author">${data.user}</span>
                    <span class="msg-text">${data.text}</span>
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        // --- USUÁRIOS E PERFIL ---
        socket.on('user_list', (users) => {
            const list = document.getElementById('user-list');
            list.innerHTML = '';
            document.getElementById('user-count').innerText = users.length;
            users.forEach(u => {
                if (u.username === currentUser) return;
                const div = document.createElement('div');
                div.className = 'user-item';
                div.onclick = () => openDM(u.username);
                div.innerHTML = `
                    <img src="${u.avatar || '/uploads/default-avatar.png'}" style="width:32px; height:32px; border-radius:50%; object-fit: cover;">
                    <span style="font-size: 0.9em;">${u.username}</span>
                    <div class="status-dot"></div>
                `;
                list.appendChild(div);
            });
        });

        socket.on('refresh_users', () => socket.emit('get_users'));

        function toggleModal(id, show) {
            document.getElementById(id).style.display = show ? 'flex' : 'none';
            if (show && id === 'settings-modal') {
                document.getElementById('preview-img').src = currentAvatar;
                document.getElementById('new-name').value = currentUser;
            }
        }

        function previewFile() {
            const file = document.getElementById('file-avatar').files[0];
            const reader = new FileReader();
            reader.onloadend = () => document.getElementById('preview-img').src = reader.result;
            if (file) reader.readAsDataURL(file);
        }

        async function saveProfile() {
            const fileInput = document.getElementById('file-avatar');
            const newName = document.getElementById('new-name').value;
            let finalAvatar = currentAvatar;

            if (fileInput.files[0]) {
                const formData = new FormData();
                formData.append('image', fileInput.files[0]);
                const res = await fetch('/upload', { method: 'POST', body: formData });
                const data = await res.json();
                finalAvatar = data.url;
            }

            socket.emit('update_profile', {
                oldName: currentUser,
                newName: newName,
                newAvatar: finalAvatar
            });
        }

        socket.on('profile_updated', (data) => {
            currentUser = data.username;
            currentAvatar = data.avatar;
            document.getElementById('my-name').innerText = currentUser;
            document.getElementById('my-avatar').src = currentAvatar;
            toggleModal('settings-modal', false);
        });
    </script>
</body>

</html>
