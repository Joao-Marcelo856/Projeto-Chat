<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Clone Pro</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LOGIN -->
    <div id="auth-overlay" class="modal" style="display:flex;">
        <div class="modal-box">

            <h2 id="auth-title">Bem-vindo!</h2>

            <input type="text" id="auth-user" class="auth-input" placeholder="Usuário">

            <input type="password" id="auth-pass" class="auth-input" placeholder="Senha">

            <button id="auth-submit-btn" class="btn btn-primary" onclick="handleAuth()">
                Entrar
            </button>

            <div id="auth-toggle-text" class="toggle-link" onclick="toggleAuthMode()">
                Criar conta
            </div>

        </div>
    </div>

    <!-- SETTINGS -->
    <div id="settings-modal" class="modal">
        <div class="modal-box">

            <h3>Perfil</h3>

            <img id="preview-img" class="avatar-preview" src="/uploads/default-avatar.png">

            <input type="file" id="file-avatar" accept="image/*" onchange="previewFile()">

            <input type="text" id="new-name" class="auth-input" placeholder="Novo nome">

            <button class="btn btn-primary" onclick="saveProfile()">
                Salvar
            </button>

            <button class="btn btn-danger" onclick="logout()">
                Sair
            </button>

        </div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar" id="left-sidebar">

        <div class="sidebar-header">
            Canais
        </div>

        <div class="channel-btn active-room" onclick="changeRoom(event,'geral')">
            # geral
            <span id="badge-geral" class="notification-badge hidden">0</span>
        </div>

        <div class="channel-btn" onclick="changeRoom(event,'ajuda')">
            # ajuda
            <span id="badge-ajuda" class="notification-badge hidden">0</span>
        </div>

        <div id="admin-channel" class="channel-btn hidden" onclick="changeRoom(event, 'admin-logs')">

            🔒 admin-logs

        </div>

        <div class="sidebar-header">
            Mensagens Diretas
        </div>

        <div id="dm-list"></div>

        <div class="settings-footer">

            <div class="profile-box">

                <img id="my-avatar" src="/uploads/default-avatar.png">

                <span id="my-name">Usuário</span>

            </div>

            <span class="gear-icon" onclick="toggleModal('settings-modal', true)">
                ⚙️
            </span>

        </div>

    </div>

    <!-- CHAT -->
    <div class="chat-area">

        <div class="chat-header">

            <button class="toggle-sidebar-btn" onclick="toggleLeftSidebar()">
                ☰
            </button>

            <button class="toggle-users-btn" onclick="toggleRightSidebar()">
                👥
            </button>

            <span id="header-icon" class="header-icon">#</span>

            <div id="header-status" class="status-dot online" style="display:none;"></div>

            <h3 id="header-name">geral</h3>

        </div>

        <!-- SEARCH -->
        <div class="search-wrapper">

            <button id="search-toggle-btn" class="search-icon-btn">
                🔍
            </button>

            <div id="search-container" class="search-container hidden-search">

                <input type="text" id="search-input" placeholder="Pesquisar mensagens...">

            </div>

        </div>

        <div id="pinned-message-container" class="hidden">
            <span>📌 Mensagem Fixada:</span>

            <div id="pinned-message-content"></div>
        </div>

        <div id="messages"></div>

        <div class="typing-indicator" id="typing-indicator"></div>

        <div class="input-container">

            <div id="reply-preview-box" class="reply-preview-bar" style="display: none;">
                <div class="reply-preview-content">
                    <span class="reply-arrow">⤹</span>
                    <span id="reply-preview-text">Respondendo a...</span>
                </div>
                <button class="cancel-reply-btn" onclick="cancelReply()">✕</button>
            </div>

            <div class="input-area">

                <input type="file" id="file-image" accept="image/*" style="display:none;" onchange="sendPhoto()">

                <button class="attach-btn" onclick="document.getElementById('file-image').click()">
                    +
                </button>

                <input type="text" id="message-input" placeholder="Conversar...">

            </div>

        </div>

    </div>

    <!-- USERS -->
    <div class="users-sidebar" id="right-sidebar">

        <div class="users-title">
            Usuários — <span id="user-count">0</span>
        </div>

        <div id="user-list"></div>

    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script src="client.js"></script>

</body>

</html>
