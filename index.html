<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Chat Clone</title>
    <style>
        :root {
            --bg-dark: #202225;
            --bg-main: #36393f;
            --bg-input: #40444b;
            --text-main: #dcddde;
            --blurple: #5865f2;
            --danger: #ed4245;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }

        /* MODAL DE LOGIN */
        #auth-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .auth-box {
            background: var(--bg-main);
            padding: 30px;
            border-radius: 8px;
            width: 400px;
            text-align: center;
        }

        .auth-box input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: var(--bg-dark);
            border: none;
            color: white;
            border-radius: 4px;
        }

        .auth-box button {
            background: var(--blurple);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }

        .auth-toggle {
            margin-top: 15px;
            font-size: 0.9em;
            cursor: pointer;
            color: #00aff4;
        }

        /* LAYOUT */
        .app-container {
            display: flex;
            height: 100vh;
        }

        .channels {
            width: 240px;
            background: #2f3136;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
        }

        .channel-btn {
            padding: 10px;
            cursor: pointer;
            border-radius: 4px;
            margin-bottom: 5px;
            color: #8e9297;
        }

        .channel-btn:hover,
        .active-room {
            background: #393c43;
            color: white;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        /* MENSAGENS */
        .message {
            margin-bottom: 15px;
            position: relative;
            transition: 0.2s;
            padding: 8px;
            border-radius: 4px;
        }

        .message:hover {
            background: #32353b;
        }

        .message-author {
            color: #fff;
            font-weight: bold;
            margin-right: 8px;
        }

        .reply-indicator {
            font-size: 0.8em;
            color: #b9bbbe;
            margin-bottom: 4px;
            display: block;
        }

        .chat-img {
            max-width: 300px;
            border-radius: 8px;
            display: block;
            margin-top: 8px;
            border: 1px solid #444;
        }

        .actions-menu {
            position: absolute;
            right: 10px;
            top: 5px;
            display: none;
            background: var(--bg-dark);
            border-radius: 4px;
            border: 1px solid #444;
        }

        .message:hover .actions-menu {
            display: flex;
        }

        .btn-action {
            padding: 5px 10px;
            font-size: 0.75em;
            cursor: pointer;
            border: none;
            color: white;
            background: none;
        }

        .btn-reply:hover {
            background: var(--blurple);
        }

        .btn-delete:hover {
            background: var(--danger);
        }

        /* BARRA DE INPUT */
        .input-wrapper {
            padding: 20px;
            background: var(--bg-main);
        }

        .input-box {
            background: var(--bg-input);
            display: flex;
            padding: 10px;
            border-radius: 8px;
            align-items: center;
        }

        #input {
            flex: 1;
            background: none;
            border: none;
            color: white;
            outline: none;
            padding: 5px;
            font-size: 1em;
        }

        .btn-img {
            padding: 5px 10px;
            cursor: pointer;
            font-size: 1.2em;
            filter: grayscale(1);
            transition: 0.2s;
        }

        .btn-img:hover {
            filter: grayscale(0);
            transform: scale(1.1);
        }

        .user-footer {
            background: #292b2f;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .btn-logout {
            font-size: 0.7em;
            background: #4f545c;
            padding: 5px 8px;
            border-radius: 3px;
            cursor: pointer;
        }

        .btn-logout:hover {
            background: var(--danger);
        }

        .message {
            display: flex;
            align-items: flex-start;
            /* Alinha a imagem com o topo do texto */
            padding: 10px;
        }

        .message-content {
            display: flex;
            flex-direction: column;
        }
    </style>
</head>

<body>

    <div id="auth-overlay">
        <div class="auth-box">
            <h2 id="auth-title">Amigos Chat</h2>
            <input type="text" id="auth-user" placeholder="Usuário">
            <input type="password" id="auth-pass" placeholder="Senha">
            <button id="btn-auth-main" onclick="handleAuth()">Entrar</button>
            <p class="auth-toggle" onclick="toggleAuthMode()" id="auth-mode-text">Novo por aqui? Registre-se</p>
        </div>
    </div>

    <div class="app-container">
        <div class="channels">
            <h3 style="margin-bottom:15px; font-size: 1.1em;">Canais</h3>
            <div class="channel-btn active-room" onclick="changeRoom('geral')"># geral</div>
            <div class="channel-btn" onclick="changeRoom('jogos')"># jogos</div>

            <div class="user-footer">
                <span id="display-username" style="font-weight: bold; font-size: 0.9em;"></span>
                <span class="btn-logout" onclick="logout()">Sair</span>
            </div>
        </div>

        <main class="chat-area">
            <div id="messages"></div>

            <div class="input-wrapper">
                <div class="input-box">
                    <label class="btn-img" title="Enviar Imagem">
                        📷<input type="file" id="imgInput" hidden onchange="uploadImage(this)">
                    </label>
                    <input type="text" id="input" placeholder="Conversar em #geral"
                        onkeypress="if(event.key==='Enter') send()">
                    <button onclick="send()"
                        style="background:none; border:none; padding:10px; cursor:pointer; font-size: 1.2em;">➡️</button>
                </div>
            </div>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUser = localStorage.getItem('chat_user');
        let currentRoom = 'geral';
        let isRegister = false;
        let replyId = null;
        let username = localStorage.getItem('chat_user');
        let avatarUrl = localStorage.getItem('chat_avatar') || 'https://via.placeholder.com/40';

        if (!username) {
            username = prompt("Como você quer ser chamado?");
            avatarUrl = prompt("Cole o link da sua foto de perfil (URL):") || 'https://via.placeholder.com/40';
            localStorage.setItem('chat_user', username);
            localStorage.setItem('chat_avatar', avatarUrl);
        }

        if (currentUser) {
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('display-username').innerText = currentUser;
            socket.emit('switch_room', currentRoom);
        }

        function toggleAuthMode() {
            isRegister = !isRegister;
            document.getElementById('auth-title').innerText = isRegister ? "Criar Conta" : "Login";
            document.getElementById('btn-auth-main').innerText = isRegister ? "Registrar" : "Entrar";
            document.getElementById('auth-mode-text').innerText = isRegister ? "Já tem conta? Faça Login" : "Novo por aqui? Registre-se";
        }

        function handleAuth() {
            const u = document.getElementById('auth-user').value;
            const p = document.getElementById('auth-pass').value;
            if (!u || !p) return alert("Preencha todos os campos!");
            socket.emit(isRegister ? 'register' : 'login', { username: u, password: p });
        }

        socket.on('auth_success', (user) => {
            localStorage.setItem('chat_user', user);
            location.reload();
        });

        socket.on('auth_error', (msg) => alert(msg));

        function sendMessage(event) {
            event.preventDefault();
            const input = document.getElementById('input');

            if (input.value.trim() !== '') {
                socket.emit('chat message', {
                    user: username,
                    avatar: avatarUrl, // <--- Enviando a foto junto
                    text: input.value,
                    room: currentRoom
                });
                input.value = '';
            }
        }

        function send() {
            const input = document.getElementById('input');
            if (!input.value.trim()) return;

            socket.emit('chat message', {
                user: currentUser,
                avatar: avatarUrl,
                text: input.value,
                room: currentRoom,
                replyToId: replyId
            });
            input.value = '';
            cancelReply();
        }

        function uploadImage(el) {
            const file = el.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append("image", file);

            fetch("/upload", {
                method: "POST",
                body: formData
            })
                .then(res => res.json())
                .then(data => {
                    socket.emit("chat message", {
                        user: currentUser,
                        avatar: avatarUrl,
                        text: "",
                        image_url: data.url,
                        room: currentRoom
                    });
                });
        }

        socket.on('chat message', (data) => {
            renderMsg(data);

            div.innerHTML = `
    <img src="${data.avatar}" style="width: 40px; height: 40px; border-radius: 50%; margin-right: 10px;">
    <div class="message-content">
        <div class="actions-menu">
            ${data.user === currentUser ? `<button class="btn-action btn-delete" onclick="socket.emit('delete message', ${data.id})">Apagar</button>` : ''}
        </div>
        <span class="message-author">${data.user}</span>
        <span class="message-text">${data.text}</span>
    </div>
`;
            messagesContainer.appendChild(div);
        });

        socket.on('load_history', (msgs) => {
            document.getElementById('messages').innerHTML = '';
            msgs.forEach(m => renderMsg(m));
        });

        function renderMsg(data) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message';
            div.id = `msg-${data.id}`;

            // Corrige nomes das propriedades vindas do banco (que usam snake_case) ou do socket (camelCase)
            const replyTo = data.reply_to_id || data.replyToId;
            const imgUrl = data.image_url || data.imageUrl;

            div.innerHTML = `
                ${replyTo ? `<span class="reply-indicator">↪ respondendo msg #${replyTo}</span>` : ''}
                <div class="actions-menu">
                    <button class="btn-action btn-reply" onclick="setReply(${data.id},'${data.user}')">Responder</button>
                    ${data.user === currentUser ? `<button class="btn-action btn-delete" onclick="socket.emit('delete message', ${data.id})">Apagar</button>` : ''}
                </div>
                <span class="message-author">${data.user}</span>
                <span class="message-text">${data.text}</span>
                ${imgUrl ? `<img src="${imgUrl}" class="chat-img">` : ''}
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        socket.on(`message deleted`, (id) => {
            const msgElement = document.getElementById(`msg-${id}`);
            if (msgElement) msgElement.remove();
        });

        function setReply(id, user) {
            replyId = id;
            document.getElementById('input').placeholder = `Respondendo a ${user}... (ESC para cancelar)`;
            document.getElementById('input').focus();
        }

        function cancelReply() {
            replyId = null;
            document.getElementById('input').placeholder = `Conversar em #${currentRoom}`;
        }

        window.onkeydown = (e) => { if (e.key === 'Escape') cancelReply(); }

        function changeRoom(r) {
            currentRoom = r;

            // 1. Limpa a tela antes de carregar o histórico
            const messagesContainer = document.getElementById('messages');
            messagesContainer.innerHTML = '';

            // 2. Avisa o servidor para trocar de sala
            socket.emit('switch_room', r);

            // 3. Destaca o botão ativo (CSS)
            document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active-room'));
            event.target.classList.add('active-room');

            cancelReply();
        }

        function logout() {
            localStorage.removeItem('chat_user');
            location.reload();
        }
    </script>
</body>

</html>
