<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Chat Clone - Pro</title>
    <style>
        :root {
            --bg-dark: #202225;
            --bg-main: #36393f;
            --bg-input: #40444b;
            --text-main: #dcddde;
            --blurple: #5865f2;
            --danger: #ed4245;
            --text-muted: #b9bbbe;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* BARRA LATERAL ESQUERDA (CANAIS) */
        .sidebar {
            width: 240px;
            background: #2f3136;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 15px;
            font-weight: bold;
            border-bottom: 1px solid #202225;
        }

        .channel-btn {
            padding: 10px;
            margin: 2px 8px;
            cursor: pointer;
            border-radius: 4px;
        }

        .channel-btn:hover,
        .active-room {
            background: #393d43;
            color: #fff;
        }

        /* ÁREA PRINCIPAL DO CHAT */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            position: relative;
        }

        .msg-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #eee;
            object-fit: cover;
        }

        .msg-content {
            display: flex;
            flex-direction: column;
        }

        .msg-author {
            font-weight: bold;
            color: #fff;
            font-size: 0.9em;
        }

        /* BARRA LATERAL DIREITA (USUÁRIOS) */
        .users-sidebar {
            width: 200px;
            background: #2f3136;
            padding: 10px;
            border-left: 1px solid #202225;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            cursor: pointer;
            border-radius: 5px;
        }

        .user-item:hover {
            background: #393d43;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #43b581;
            border-radius: 50%;
        }

        /* INPUT E CONTROLES */
        .input-container {
            padding: 20px;
            background: var(--bg-main);
        }

        #input {
            width: 100%;
            background: var(--bg-input);
            border: none;
            padding: 12px;
            border-radius: 8px;
            color: #fff;
            outline: none;
        }

        /* MODAL E CONFIGURAÇÕES */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-box {
            background: var(--bg-main);
            padding: 32px;
            border-radius: 8px;
            width: 400px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .modal-box h2 {
            margin-bottom: 8px;
            color: #fff;
        }

        .modal-box p {
            color: var(--text-muted);
            font-size: 0.9em;
            margin-bottom: 20px;
        }

        .auth-input {
            width: 100%;
            background: var(--bg-dark);
            border: 1px solid #202225;
            padding: 12px;
            border-radius: 4px;
            color: #fff;
            margin-bottom: 15px;
            outline: none;
        }

        .auth-input:focus {
            border-color: var(--blurple);
        }

        .avatar-preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 10px auto;
            display: block;
            border: 3px solid var(--blurple);
            object-fit: cover;
        }

        .settings-footer {
            background: #292b2f;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .gear-icon {
            cursor: pointer;
            font-size: 20px;
            transition: transform 0.3s;
            opacity: 0.7;
        }

        .gear-icon:hover {
            transform: rotate(90deg);
            opacity: 1;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-primary {
            background: var(--blurple);
            color: #fff;
        }

        .btn-primary:hover {
            background: #4752c4;
        }

        .toggle-link {
            color: #00aff4;
            cursor: pointer;
            font-size: 0.85em;
            margin-top: 15px;
            display: inline-block;
        }

        .toggle-link:hover {
            text-decoration: underline;
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
            margin-top: 10px;
        }

        .btn-danger:hover {
            background: #a12d2f;
        }

        .input-area {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-input);
            padding: 5px 15px;
            border-radius: 8px;
        }

        .attach-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .attach-btn:hover {
            color: #fff;
        }

        .chat-header {
            height: 48px;
            min-height: 48px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            background: var(--bg-main);
            border-bottom: 1px solid #202225;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .header-icon {
            color: #8e9297;
            font-size: 22px;
            margin-right: 8px;
            font-weight: 400;
        }

        #header-name {
            font-size: 16px;
            color: #fff;
            font-weight: 600;
        }

        /* Base da bolinha */
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
            border: 2px solid var(--bg-main);
            /* Dá um pequeno contorno para destacar */
        }

        /* Cores de status */
        .online {
            background-color: #3ba55d;
        }

        .offline {
            background-color: #747f8d;
        }

        .away {
            background-color: #faa61a;
        }

        /* Opcional: Ausente */

        /* Ajuste no cabeçalho para alinhar tudo */
        .chat-header {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            background: var(--bg-main);
            border-bottom: 1px solid #202225;
        }
    </style>
</head>

<body>

    <!-- LOGIN -->
    <div id="auth-overlay" class="modal" style="display:flex;">
        <div class="modal-box">
            <h2 id="auth-title">Bem-vindo!</h2>

            <input type="text" id="auth-user" class="auth-input" placeholder="Usuário">
            <input type="password" id="auth-pass" class="auth-input" placeholder="Senha">

            <button id="auth-submit-btn" class="btn btn-primary" onclick="handleAuth()">
                Entrar
            </button>

            <div id="auth-toggle-text" class="toggle-link" onclick="toggleAuthMode()">
                Criar conta
            </div>
        </div>
    </div>

    <!-- CONFIG -->
    <div id="settings-modal" class="modal">
        <div class="modal-box">

            <h3>Perfil</h3>

            <img id="preview-img" class="avatar-preview" src="/uploads/default-avatar.png">

            <input type="file" id="file-avatar" accept="image/*" onchange="previewFile()">

            <input type="text" id="new-name" class="auth-input" placeholder="Novo nome">

            <button class="btn btn-primary" onclick="saveProfile()">
                Salvar
            </button>

            <button class="btn btn-danger" onclick="logout()">
                Sair
            </button>

        </div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">

        <div class="sidebar-header">
            Canais
        </div>

        <div class="channel-btn active-room" onclick="changeRoom(event,'geral')">
            # geral
        </div>

        <div class="channel-btn" onclick="changeRoom(event,'ajuda')">
            # ajuda
        </div>

        <div style="margin-top:auto;" class="settings-footer">

            <div style="display:flex;align-items:center;gap:8px;">

                <img id="my-avatar" src="/uploads/default-avatar.png"
                    style="width:32px;height:32px;border-radius:50%;object-fit:cover;">

                <span id="my-name">Usuário</span>

            </div>

            <span class="gear-icon" onclick="toggleModal('settings-modal',true)">
                ⚙️
            </span>

        </div>
    </div>

    <!-- CHAT -->
    <div class="chat-area">

        <div class="chat-header">
            <span id="header-icon" class="header-icon">#</span>
            <div id="header-status" class="status-dot online" style="display:none;"></div>

            <h3 id="header-name">geral</h3>
        </div>

        <div id="messages"></div>

        <div class="input-container">

            <div class="input-area">

                <input type="file" id="file-image" accept="image/*" style="display:none;" onchange="sendPhoto()">

                <button class="attach-btn" onclick="document.getElementById('file-image').click()">
                    +
                </button>

                <input type="text" id="message-input" placeholder="Conversar..."
                    style="flex:1;background:none;border:none;color:#fff;outline:none;">

            </div>

        </div>

    </div>

    <!-- USERS -->
    <div class="users-sidebar">

        <div style="font-weight:bold;margin-bottom:10px;">
            Usuários — <span id="user-count">0</span>
        </div>

        <div id="user-list"></div>

    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script>

        const socket = io();

        let currentUser = null;
        let currentAvatar = "/uploads/default-avatar.png";
        let currentRoom = "geral";
        let isLoginMode = true;

        // AUTH

        function toggleAuthMode() {

            isLoginMode = !isLoginMode;

            document.getElementById("auth-submit-btn").innerText =
                isLoginMode ? "Entrar" : "Registrar";

            document.getElementById("auth-toggle-text").innerText =
                isLoginMode
                    ? "Criar conta"
                    : "Já tenho conta";
        }

        function handleAuth() {

            const username =
                document.getElementById("auth-user").value;

            const password =
                document.getElementById("auth-pass").value;

            if (!username || !password) {
                return alert("Preencha tudo");
            }

            socket.emit(
                isLoginMode ? "login" : "register",
                { username, password }
            );
        }

        socket.on("auth_success", (data) => {

            currentUser = data.username;
            currentAvatar = data.avatar || "/uploads/default-avatar.png";

            window.isAdmin = data.isAdmin || 0;

            document.getElementById("auth-overlay").style.display = "none";

            document.getElementById("my-name").innerText =
                currentUser;

            document.getElementById("my-avatar").src =
                currentAvatar;

            socket.emit("switch_room", "geral");

            socket.emit("get_users");
        });

        socket.on("auth_error", (msg) => {
            alert(msg);
        });

        // ROOM

        function changeRoom(event, room) {

            currentRoom = room;

            document.getElementById("messages").innerHTML = "";

            socket.emit("switch_room", room);

            document.querySelectorAll(".channel-btn")
                .forEach(btn => btn.classList.remove("active-room"));

            if (event) {
                event.target.classList.add("active-room");
            }

            updateHeader(room, false);
        }

        // HEADER

        function updateHeader(name, isDM = false) {

            const icon =
                document.getElementById("header-icon");

            const status =
                document.getElementById("header-status");

            const title =
                document.getElementById("header-name");

            if (isDM) {

                icon.style.display = "none";

                status.style.display = "block";

            } else {

                icon.style.display = "block";

                status.style.display = "none";
            }

            title.innerText = name;
        }

        // DM

        function openDM(targetUser) {

            if (targetUser === currentUser) return;

            const room =
                [currentUser, targetUser]
                    .sort()
                    .join("_pm_");

            currentRoom = room;

            document.getElementById("messages").innerHTML = "";

            socket.emit("switch_room", room);

            updateHeader(targetUser, true);
        }

        // SEND MESSAGE

        document
            .getElementById("message-input")
            .addEventListener("keypress", (e) => {

                if (e.key === "Enter") {

                    const text = e.target.value.trim();

                    if (!text) return;

                    socket.emit("chat message", {
                        room: currentRoom,
                        user: currentUser,
                        avatar: currentAvatar,
                        text
                    });

                    e.target.value = "";
                }
            });

        // RECEIVE MESSAGE

        socket.on("chat message", (data) => {

            if (data.room !== currentRoom) return;

            addMessageToUI(data);
        });

        socket.on("load_history", (rows) => {

            const container =
                document.getElementById("messages");

            container.innerHTML = "";

            rows.forEach(addMessageToUI);
        });

        socket.on("message_deleted", (messageId) => {

            const msg = document.getElementById(`msg-${messageId}`);

            if (msg) {
                msg.remove();
            }
        });

        // UI MESSAGE

        function addMessageToUI(data) {

            const container =
                document.getElementById("messages");

            const div =
                document.createElement("div");

            div.className = "message";

            div.id = `msg-${data.id}`;

            div.innerHTML = `
            <img src="${data.avatar || '/uploads/default-avatar.png'}"
                 class="msg-avatar">

            <div class="msg-content">

                <span class="msg-author">
                    ${data.user}
                </span>

                <span class="msg-text">
                    ${data.text || ""}
                </span>

                ${data.image_url
                    ? `
                    <img
                        src="${data.image_url}"
                        class="chat-img"
                        style="
                            max-width:250px;
                            border-radius:10px;
                            margin-top:5px;
                        ">
                    `
                    : ""
                }

                ${window.isAdmin
                    ? `
                    <button
                        onclick="deleteMessage(${data.id})"
                        style="
                            margin-top:5px;
                            background:#ed4245;
                            border:none;
                            color:white;
                            padding:5px 10px;
                            border-radius:5px;
                            cursor:pointer;
                        ">
                        Apagar
                    </button>
                    `
                    : ""
                }

            </div>
        `;

            container.appendChild(div);

            container.scrollTop = container.scrollHeight;
        }

        // USERS

        socket.on("user_list", (users) => {

            const list =
                document.getElementById("user-list");

            list.innerHTML = "";

            document.getElementById("user-count").innerText =
                users.length;

            users.forEach(user => {

                if (user.username === currentUser) return;

                const div =
                    document.createElement("div");

                div.className = "user-item";

                div.onclick = () =>
                    openDM(user.username);

                div.innerHTML = `
    <div class="status-dot online"></div>

    <img src="${user.avatar}"
         style="width:32px;height:32px;border-radius:50%;object-fit:cover;">

    <span>${user.username}</span>

    ${window.isAdmin ? `
        <div style="margin-left:auto;display:flex;gap:5px;">

            <button onclick="event.stopPropagation(); muteUser('${user.username}')"
                style="
                    background:#faa61a;
                    border:none;
                    color:white;
                    padding:3px 6px;
                    border-radius:5px;
                    cursor:pointer;
                ">
                Mute
            </button>

            <button onclick="event.stopPropagation(); banUser('${user.username}')"
                style="
                    background:#ed4245;
                    border:none;
                    color:white;
                    padding:3px 6px;
                    border-radius:5px;
                    cursor:pointer;
                ">
                Ban
            </button>

        </div>
    ` : ""}
`;

                list.appendChild(div);
            });
        });

        socket.on("refresh_users", () => {
            socket.emit("get_users");
        });

        // PROFILE

        function toggleModal(id, show) {

            document.getElementById(id).style.display =
                show ? "flex" : "none";
        }

        function previewFile() {

            const file =
                document.getElementById("file-avatar").files[0];

            if (!file) return;

            const reader =
                new FileReader();

            reader.onloadend = () => {
                document.getElementById("preview-img").src =
                    reader.result;
            };

            reader.readAsDataURL(file);
        }

        async function saveProfile() {

            const file =
                document.getElementById("file-avatar").files[0];

            const newName =
                document.getElementById("new-name").value;

            let avatar =
                currentAvatar;

            if (file) {

                const formData =
                    new FormData();

                formData.append("image", file);

                const res =
                    await fetch("/upload", {
                        method: "POST",
                        body: formData
                    });

                const data =
                    await res.json();

                avatar = data.url;
            }

            socket.emit("update_profile", {
                oldName: currentUser,
                newName,
                newAvatar: avatar
            });
        }

        socket.on("profile_updated", (data) => {

            currentUser = data.username;
            currentAvatar = data.avatar;

            document.getElementById("my-name").innerText =
                currentUser;

            document.getElementById("my-avatar").src =
                currentAvatar;

            toggleModal("settings-modal", false);
        });

        // PHOTO

        async function sendPhoto() {

            const file =
                document.getElementById("file-image").files[0];

            if (!file) return;

            const formData =
                new FormData();

            formData.append("image", file);

            const res =
                await fetch("/upload", {
                    method: "POST",
                    body: formData
                });

            const data =
                await res.json();

            socket.emit("chat message", {
                room: currentRoom,
                user: currentUser,
                avatar: currentAvatar,
                text: "",
                image_url: data.url
            });
        }

        // LOGOUT

        function logout() {

            localStorage.clear();

            location.reload();
        }

        // DELETE MESSAGE

        function deleteMessage(messageId) {

            socket.emit("delete_message", {
                messageId,
                admin: currentUser
            });
        }

        function muteUser(username) {

            socket.emit("mute_user", {
                admin: currentUser,
                target: username
            });

            alert(username + " foi silenciado.");
        }

        function banUser(username) {

            const confirmar =
                confirm("Banir " + username + "?");

            if (!confirmar) return;

            socket.emit("ban_user", {
                admin: currentUser,
                target: username
            });

            alert(username + " foi banido.");
        }

        socket.on("user_banned", () => {

            alert("Você foi banido.");

            socket.disconnect();

            location.reload();
        });

    </script>

</body>

</html>
